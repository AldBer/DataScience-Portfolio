- name: Build Structure
  run: |
    mkdir -p _site
    echo '<!DOCTYPE html>
    <html>
      <head>
        <meta http-equiv="refresh" content="0; url=01_SP_Housing/">
      </head>
    </html>' > _site/index.html
    cp -r 01_SP_Housing assets _site/ || echo "Algum arquivo não existe"

- name: Validate Build
  run: |
    [ -f "_site/index.html" ] || exit 1
    [ -d "_site/01_SP_Housing" ] || exit 1

- uses: peaceiris/actions-gh-pages@v3
  with:
    github_token: ${{ secrets.GITHUB_TOKEN }}
    publish_dir: ./_site
    keep_files: false