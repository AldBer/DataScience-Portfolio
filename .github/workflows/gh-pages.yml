name: Deploy Static Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Files
        run: |
          mkdir -p _site
          if [ -d "assets" ]; then cp -r assets _site/; fi
          if [ -f "index.html" ]; then cp index.html _site/; fi
          ls -la _site

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site