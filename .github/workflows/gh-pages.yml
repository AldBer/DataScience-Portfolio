name: Deploy Static Site

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Files
        run: |
          mkdir -p _site
          # Copia apenas o que existe
          [ -d "assets" ] && cp -r assets _site/ || echo "Pasta assets não encontrada"
          [ -f "index.html" ] && cp index.html _site/ || echo "index.html não encontrado"
          [ -d "01_SP_Housing" ] && cp -r 01_SP_Housing _site/ || echo "Pasta 01_SP_Housing não encontrada"
          [ -d "02_Crypto_Analysis" ] && cp -r 02_Crypto_Analysis _site/ || echo "Pasta 02_Crypto_Analysis não encontrada"
          ls -la _site  # Debug

      - name: Verify Files
	run: |
	  echo "Estrutura final:"
	  find _site -type f
	  [ -f "_site/index.html" ] || exit 1

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false