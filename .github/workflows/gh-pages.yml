name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository + LFS
        uses: actions/checkout@v3
        with:
          lfs: true  # Para baixar arquivos grandes (shapefiles)

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Structure
        run: |
          mkdir -p _site
          # Página de redirecionamento
          echo '<!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=dashboards/" />
            </head>
          </html>' > _site/index.html
          
          # Copia apenas o necessário (ajuste os caminhos conforme sua estrutura real)
          cp -r dashboards _site/
          cp -r README.md _site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true