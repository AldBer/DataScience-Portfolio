name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Mova para dentro do job
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          lfs: true  # Adicione isso para Git LFS

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build Structure
        run: |
          mkdir -p _site
          echo '<!DOCTYPE html>
          <html lang="pt-BR">
            <head>
              <meta charset="UTF-8">
              <title>Portfólio Data Science</title>
              <meta http-equiv="refresh" content="0; url=01_SP_Housing/">
            </head>
          </html>' > _site/index.html
          cp -r 01_SP_Housing 02_Crypto_Analysis assets _site/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true  # Limpa branch gh-pages completamente