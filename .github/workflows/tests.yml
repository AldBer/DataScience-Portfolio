name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        pip install pandas streamlit plotly geopandas pytest
        
    - name: Run basic validation
      run: |
        echo "✅ Validando estrutura do projeto..."
        
        # Verificar se arquivos essenciais existem
        [ -f "01-real-estate-sp/requirements.txt" ] && echo "✅ requirements.txt existe" || echo "⚠️  requirements.txt não encontrado"
        [ -f "01-real-estate-sp/app_housing/main.py" ] && echo "✅ main.py existe" || echo "⚠️  main.py não encontrado"
        
        # Testar imports básicos
        python -c "import pandas, streamlit, plotly; print('✅ Bibliotecas principais importam corretamente')"
        
    - name: Test completed
      run: echo "🎉 Validação concluída com sucesso!"